{% extends "base.html" %}

{% block title %}Log In | PCCS{% endblock %}

{% block content_title %}
  <h2>Log In</h2>
{% endblock %}

{% block content %}

{% if form.errors %}
<p>Your username and password didn't match. Please try again.</p>
{% endif %}

<form class="form-horizontal" method="post" action="{% url 'users:login' %}">
  {% csrf_token %}
  <div class="form-group">
    <label for="id_username" class="col-sm-2 control-label">{{ form.username.label_tag }}</label>
    <div class="col-sm-10">
      <input type="username" class="form-control" id="id_username" name="username" placeholder="Username">
    </div>
  </div>
  <div class="form-group">
    <label for="id_password" class="col-sm-2 control-label">{{ form.password.label_tag }}</label>
    <div class="col-sm-10">
      <input type="password" class="form-control" id="id_password" name="password" placeholder="Password">
    </div>
  </div>
  <div class="form-group">
    <div class="col-sm-offset-2 col-sm-10">
      <button type="submit" class="btn btn-default" name="login" value="login">Sign in</button>
      <button type="submit" class="btn btn-default" name="forgetP" value="forgetP">Forget password?</button>
    </div>
  </div>

  <input type="hidden" name="next" value="{{ next }}" />
</form>

{% endblock %}
